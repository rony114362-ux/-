<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>হীরক জয়ন্তী ২০২৬ — গাগলা বহুমুখী উচ্চ বিদ্যালয়</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f5f7fb;color:#172033}h1{font-size:25px}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}input,select,textarea,button{width:100%;padding:12px;margin:6px 0 10px;box-sizing:border-box;border:1px solid #ccd3df;border-radius:9px}button{background:#182b49;color:#fff;border:0;font-weight:bold}.guest{border:1px solid #ddd;padding:10px;border-radius:10px;margin:8px 0}.ok{padding:12px;background:#e7f7ed;border-radius:10px}.err{padding:12px;background:#fdeaea;border-radius:10px}</style></head><body><h1>হীরক জয়ন্তী ২০২৬</h1><p>গাগলা বহুমুখী উচ্চ বিদ্যালয়</p><div class="card"><h2>Registration</h2><div id="dates"></div><form id="f"><input name="name" placeholder="আপনার নাম" required><input name="mobile" placeholder="মোবাইল নম্বর" required><select name="shirt" required><option value="">নিজের Shirt Size</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>3XL</option></select><input name="batch" placeholder="Batch / Passing Year"><input name="profession" placeholder="Profession"><textarea name="address" placeholder="Address"></textarea><h3>Guest</h3><div id="guests"></div><button type="button" onclick="addGuest()">+ Guest যোগ করুন</button><select name="payment_method"><option value="">Payment Method</option><option value="bkash">bKash</option><option value="nagad">Nagad</option><option value="bank">Bank</option><option value="cash">Cash</option></select><div id="pay"></div><input name="txn" placeholder="Transaction ID / Reference"><input name="payment_date" type="date"><button>Registration Submit</button></form><div id="msg"></div></div><div class="card"><h2>Registration Status</h2><input id="q" placeholder="Registration ID অথবা Mobile"><button onclick="status()">Search</button><pre id="result"></pre></div><script>let cfg={};async function load(){cfg=await fetch('/api/config').then(r=>r.json());dates.innerText=`Registration: ${cfg.start_date} থেকে ${cfg.end_date} | Fee: ৳${cfg.reg_fee} + Guest ৳${cfg.guest_fee}`;pay.innerHTML=`bKash: ${cfg.bkash||'-'} | Nagad: ${cfg.nagad||'-'} | Bank: ${cfg.bank_name||'-'} ${cfg.bank_account||''}`};function addGuest(){let d=document.createElement('div');d.className='guest';d.innerHTML='<input class="gn" placeholder="Guest Name" required><select class="gs"><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>3XL</option></select>';guests.appendChild(d)}f.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));x.guests=[...document.querySelectorAll('.guest')].map(g=>({name:g.querySelector('.gn').value,shirt:g.querySelector('.gs').value}));let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});let j=await r.json();msg.className=r.ok?'ok':'err';msg.innerHTML=r.ok?`Registration successful!<br><b>ID: ${j.reg_id}</b><br>Amount: ৳${j.amount}`:j.error};async function status(){let r=await fetch('/api/status?q='+encodeURIComponent(q.value));let j=await r.json();result.textContent=r.ok?JSON.stringify(j,null,2):j.error}load()</script></body></html>
