<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HJ26 Admin</title><style>body{font-family:Arial;max-width:1000px;margin:auto;padding:14px;background:#f5f7fb}.card{background:#fff;padding:16px;margin:12px 0;border-radius:12px}input,button{padding:11px;margin:5px;width:100%;box-sizing:border-box}button{background:#182b49;color:white;border:0;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>🔐 Admin Panel</h1><div id="login" class="card"><input id="pass" type="password" placeholder="Admin Password"><button onclick="login()">Login</button><div id="le"></div></div><div id="app" hidden><div class="card"><h3>Settings</h3><input id="reg_fee" placeholder="Registration Fee"><input id="guest_fee" placeholder="Guest Fee"><input id="start_date" type="date"><input id="end_date" type="date"><input id="bkash" placeholder="bKash"><input id="nagad" placeholder="Nagad"><input id="bank_name" placeholder="Bank Name"><input id="bank_account" placeholder="Bank Account"><input id="cash_note" placeholder="Cash Note"><button onclick="save()">Save Settings</button></div><div class="card"><h3>Registrations</h3><button onclick="loadRows()">Refresh</button><div id="rows"></div></div></div><script>let token='';async function login(){token=pass.value;let r=await fetch('/api/admin/stats',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return le.textContent='Wrong password';login.style.display='none';app.hidden=false;loadRows();loadSettings()}async function loadSettings(){let s=await fetch('/api/config').then(r=>r.json());for(let k of ['reg_fee','guest_fee','start_date','end_date','bkash','nagad','bank_name','bank_account','cash_note'])document.getElementById(k).value=s[k]||''}async function save(){let o={};for(let k of ['reg_fee','guest_fee','start_date','end_date','bkash','nagad','bank_name','bank_account','cash_note'])o[k]=document.getElementById(k).value;await fetch('/api/admin/settings',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(o)});alert('Saved')}async function loadRows(){let r=await fetch('/api/admin/registrations',{headers:{Authorization:'Bearer '+token}}),a=await r.json();rows.innerHTML='<table><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Guest</th><th>Amount</th><th>Status</th><th>Action</th></tr>'+a.map(x=>`<tr><td>${x.reg_id}</td><td>${x.name}</td><td>${x.mobile}</td><td>${x.guests.length}</td><td>৳${x.amount}</td><td>${x.status}</td><td><button onclick="setStatus(${x.id},'${x.status==='paid'?'pending':'paid'}')">${x.status==='paid'?'Pending':'Paid'}</button></td></tr>`).join('')+'</table>'}async function setStatus(id,status){await fetch('/api/admin/registrations/'+id,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({status})});loadRows()}</script></body></html>
